        skipBotEvents: false
        with:
          maxConcurrentTasks:
            collaborator: 999999
            contributor: 999999
  - uses:
      - plugin: "https://ubiquity-os-plugin-demo-main.ubiquity.workers.dev"
  - uses:
      - plugin: "https://ubiquity-os-command-wallet-main.ubiquity.workers.dev"
  - uses:
