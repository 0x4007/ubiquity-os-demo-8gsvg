            contentEvaluator: {}
            userExtractor: {}
            dataPurge: {}
            formattingEvaluator: {}
            permitGeneration: {}
            githubComment: {}
          evmPrivateEncrypted: "l9ko_W0OGGUc4pbkePtjt4pJNCrjD3n1PBlTxGrkuV3eQPF3QxHpjWqQarOar0pbJKN3PVtWVQgJyG62CoFForQeUDERsA3w9_HCLU6w1gHj8-MPvMicpMucx5l0q_nmSATYZIDUOxCOKuv_Xp2WM_q4YWY3VLs3hSTIgwkgx9vi9w"
